# Port 80: redirect everything to HTTPS.
server {
    listen 80;
    server_name staging.amtaexpress.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging.amtaexpress.com;

    ssl_certificate     /etc/nginx/certs/staging.crt;
    ssl_certificate_key /etc/nginx/certs/staging.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/common/gzip.conf;
    include /etc/nginx/common/security.conf;

    location /api/ {
        include /etc/nginx/common/proxy.conf;
        proxy_pass http://backend:8000/;
    }

    location /admin/ {
        include /etc/nginx/common/proxy.conf;
        proxy_pass http://backend:8000/admin/;
    }

    location /health/ {
        include /etc/nginx/common/proxy.conf;
        proxy_pass http://backend:8000/health/;
    }

    location /static/ {
        alias /opt/amta/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /opt/amta/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://frontend:80/;
    }
}